version: 2

seeds:
  - name: capitais
    description: Capitais das 27 UFs, para medir a interiorização da pós-graduação.
    columns:
      - name: uf
        tests: [unique, not_null]

  - name: indicadores
    description: Catálogo de indicadores, gerado de indicators/indicadores.yml pela CLI (não editar).
    config:
      column_types: {indicador_id: varchar, unidade: varchar}
    columns:
      - name: indicador_id
        tests: [unique, not_null]
