[project]
name = "capes-kb"
version = "0.1.0"
description = "Base de conhecimento minimalista sobre a pós-graduação brasileira a partir dos dados abertos da CAPES"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
capes = "capes_kb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capes_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: testes que acessam o portal da CAPES (rodar com -m network)"]
addopts = "-m 'not network'"
