version: 2

models:
  - name: int_teses_palavras_chave
    description: Palavras-chave dos trabalhos, separadas e normalizadas (um registro por trabalho × termo).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_trabalho, chave, forma]

  - name: int_programa_recortes
    description: Atributos de recorte (região, UF, área, modalidade...) por programa × ano.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cd_programa, ano]
